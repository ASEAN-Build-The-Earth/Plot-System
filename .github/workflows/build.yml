name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout main on push
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build
      # START ASEAN - Testing
      - name: Report Test Result
        uses: mikepenz/action-junit-report@v5
        if: success() || failure() # always run even if the previous step fails
        with:
          check_name: JUnit Test Result
          report_paths: "**/build/test-results/test/TEST-*.xml"
          check_title_template: '<code>{{CLASS_NAME}}</code> › {{TEST_NAME}}'
          detailed_summary: true # display detailed summary of the report
          include_passed: true # include passed tests in the results table
          group_suite: true # Group tests by suite name
          comment: true # send comment in pull request
      # END ASEAN
      - uses: actions/upload-artifact@v7
        with:
          name: Staging-Build
          path: build/libs
          compression-level: '9'